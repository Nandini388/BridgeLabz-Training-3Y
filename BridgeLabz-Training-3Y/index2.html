<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="container">

        <!-- Purple Header -->
        <div class="header">
            Header
        </div>

        <div class="content">

            <!-- Left Section -->
            <div class="left-section">

                <!-- Turquoise Upper Box -->
                <div class="right-up">
                    right-up
                </div>

                <!-- Bottom Section -->
                <div class="bottom-section">

                    <div class="down-left">
                        down-L
                    </div>

                    <div class="down-right">
                        down-R
                    </div>

                </div>

            </div>

            <!-- White Right Box -->
            <div class="right-section">
                right
            </div>

        </div>

    </div>

</body>
</html>
