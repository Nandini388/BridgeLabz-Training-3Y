<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Team</h1>

    <div class="profiles">

        <div class="profile-card">
            <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile 1">
            <h2>Sarah</h2>
            <p>Web Designer</p>
        </div>

        <div class="profile-card">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile 2">
            <h2>John</h2>
            <p>Developer</p>
        </div>

        <div class="profile-card">
            <img src="https://randomuser.me/api/portraits/women/65.jpg" alt="Profile 3">
            <h2>Emma</h2>
            <p>Data Analyst</p>
        </div>

    </div>

</body>
</html>
