<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Filter Gallery</h1>

    <div class="gallery">

        <div class="image-box">
            <img class="blur" src="https://picsum.photos/id/1015/400/300" alt="Mountain">
            <p>Blur</p>
        </div>

        <div class="image-box">
            <img class="grayscale" src="https://picsum.photos/id/1016/400/300" alt="Nature">
            <p>Grayscale</p>
        </div>

        <div class="image-box">
            <img class="sepia" src="https://picsum.photos/id/1025/400/300" alt="Dog">
            <p>Sepia</p>
        </div>

        <div class="image-box">
            <img class="brightness" src="https://picsum.photos/id/1035/400/300" alt="Water">
            <p>Brightness</p>
        </div>

        <div class="image-box">
            <img class="contrast" src="https://picsum.photos/id/1043/400/300" alt="Forest">
            <p>Contrast</p>
        </div>

        <div class="image-box">
            <img class="hue" src="https://picsum.photos/id/1069/400/300" alt="Beach">
            <p>Hue Rotate</p>
        </div>

    </div>

</body>
</html>
