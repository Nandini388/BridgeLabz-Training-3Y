<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="question2.css">
</head>

<body>

<header>
    <h1>CSS Tooltip Demonstration</h1>
</header>

<main>
    <section class="tooltip-container">

        <div class="tooltip-box">
            Home
            <span class="tooltip">Go to Home</span>
        </div>

        <div class="tooltip-box">
            Search
            <span class="tooltip">Search something</span>
        </div>

        <div class="tooltip-box">
            Profile
            <span class="tooltip">View your profile</span>
        </div>

        <div class="tooltip-box">
            Settings
            <span class="tooltip">Open settings</span>
        </div>

    </section>
</main>

<footer>
    <p>CSS Only Tooltip</p>
</footer>

</body>
</html>
