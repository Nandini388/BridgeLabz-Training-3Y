<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Photo Gallery</title>
    <link rel="stylesheet" href="question6.css">
</head>
<body>

        <h1>Beautiful Places Gallery</h1>

        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1016/600/400" alt="Nature">

            <img src="https://picsum.photos/id/1019/600/400" alt="Forest">

            <img src="https://picsum.photos/id/1020/600/400" alt="Animals">
