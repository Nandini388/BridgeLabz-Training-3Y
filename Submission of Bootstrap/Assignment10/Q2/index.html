<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white text-center p-5">
        <h1 class="fw-bold">Nandini Raj Srivastava</h1>
        <p class="lead">Aspiring AI & Data Science Developer</p>
    </header>

    <main class="container mt-4 mb-4">

        <section class="text-center">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300"
                 class="img-fluid rounded-circle profile-img"
                 alt="Profile Image">

            <h2 class="mt-4 fw-bold">About Me</h2>

            <p class="text-dark">
                I am a B.Tech student interested in web development,
                artificial intelligence and data science.
            </p>

            <button class="btn btn-primary me-2">Hire Me</button>
            <button class="btn btn-outline-primary">Download CV</button>
        </section>

        <!-- Contact Form -->
        <section class="mt-5">
            <h2 class="text-center mb-3">Contact Me</h2>

            <form class="col-md-6 mx-auto">
                <input type="text" class="form-control mb-3" placeholder="Enter your name">

                <input type="email" class="form-control mb-3" placeholder="Enter your email">

                <textarea class="form-control mb-3" rows="4" placeholder="Your message"></textarea>

                <button class="btn btn-success w-100" type="button">Send Message</button>
            </form>
        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 My Portfolio</p>
    </footer>

</body>
</html>
