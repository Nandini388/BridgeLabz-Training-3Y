<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

<header>
    <h1>Height & Width Practice</h1>
</header>

<main class="container">

    <div class="box box1">
        <h2>Box 1</h2>
        <p>Height: 150px</p>
        <p>Width: 200px</p>
    </div>

    <div class="box box2">
        <h2>Box 2</h2>
        <p>Height: 25vh</p>
        <p>Width: 40%</p>
    </div>

    <div class="box box3">
        <h2>Box 3</h2>
        <p>Width: 20em</p>
        <p>Overflow Example</p>
    </div>

</main>

<footer>
    <p>CSS Size Practice</p>
</footer>

</body>
</html>
