<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <link rel="stylesheet" href="question5.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <main class="pricing-container">

        <!-- Basic Plan -->
        <div class="pricing-card">
            <h2>Basic</h2>
            <h3>₹499</h3>

            <p>1 User</p>
            <p>5 GB Storage</p>
            <p>Email Support</p>

            <button>Choose Plan</button>
        </div>

        <!-- Pro Plan -->
        <div class="pricing-card featured">
            <h2>Pro</h2>
            <h3>₹999</h3>

            <p>5 Users</p>
            <p>50 GB Storage</p>
            <p>Priority Support</p>

            <button>Choose Plan</button>
        </div>

        <!-- Premium Plan -->
        <div class="pricing-card">
            <h2>Premium</h2>
            <h3>₹1499</h3>

            <p>Unlimited Users</p>
            <p>100 GB Storage</p>
            <p>24/7 Support</p>

            <button>Choose Plan</button>
        </div>

    </main>

</body>
</html>
